name: Desktop

# Manual only. Building Electron on every push adds minutes and a 100 MB
# download to CI for no benefit; run this when a Steam depot upload is due.
on:
  workflow_dispatch:

jobs:
  pack:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run export:web
      - run: npm ci
        working-directory: desktop
      - run: npm run check
        working-directory: desktop
      - run: npm run pack
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: hfm-desktop-${{ matrix.os }}
          path: desktop/out/
          if-no-files-found: error
