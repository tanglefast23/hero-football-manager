# The gate docs 09/10 promise: typecheck + the full deterministic suite on every
# PR. Balance probes stay excluded (env-gated, see jest testPathIgnorePatterns).
#
# Two jobs, because the suite is dominated by CPU-bound sim probes: on a runner
# the whole thing passed 42 minutes without finishing jest, so a single job spent
# its entire budget before reporting anything at all. `quick` answers the
# ordinary "did I break the build" question in a couple of minutes; `full` is the
# real gate and still runs everything.
#
# `full` runs the WHOLE suite, not the complement of `quick`. That is deliberate:
# a suite mis-sorted into the fast list then costs a little duplicated time,
# never coverage — nothing can fall between the two jobs and silently stop being
# tested, which is the failure mode jest.config.js already warns about.
name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  # Measured on a fast Mac; each is several times slower on a runner.
  # gates-auto 270s, shooting 226s, balance-rails 163s, sprites 163s, store 148s,
  # m2-managed-recovery-soak 144s, match-stamina-balance 140s, power-cadence 108s,
  # attacking-balance 73s. The probe pattern is repeated here because a CLI
  # --testPathIgnorePatterns replaces jest.config.js's value rather than adding
  # to it.
  SLOW_SUITES: (src/audit/__tests__/.*-probe\.test\.ts|src/sim/__tests__/(gates-auto|shooting|balance-rails|power-cadence|attacking-balance)\.test\.ts|src/application/__tests__/(store|m2-managed-recovery-soak|match-stamina-balance)\.test\.ts|src/render/sprites/__tests__/sprites\.test\.ts)$

jobs:
  quick:
    name: typecheck + fast tests
    runs-on: ubuntu-latest
    # The fast suite is ~10 minutes locally and 19-20 on this runner, so a
    # 20-minute cap cancelled the job on runner speed alone — main saw 19m
    # (pass) and 20m (cancelled) on consecutive runs with the jest step itself
    # never failing. 30 keeps the early signal without flipping on a coin toss.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npx tsc --noEmit
      - run: npm run web:first-load:check
      - run: npx jest --ci --silent --testPathIgnorePatterns "$SLOW_SUITES"

  full:
    name: full suite
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx jest --ci --silent

  native-release:
    name: native iOS Release
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run deps:check
      - run: npm run release:check
      - name: Native suspend and audio lifecycle tests
        run: >-
          npx jest --ci --runInBand
          src/ui/__tests__/suspend-flush-lifecycle.test.ts
          src/application/__tests__/suspend-save-flush.test.ts
          src/render/__tests__/audio-lifecycle.test.ts
      - name: Generate the iOS project
        env:
          EXPO_NO_GIT_STATUS: "1"
        run: npx expo prebuild --clean --platform ios --no-install
      - name: Install CocoaPods
        run: pod install --project-directory=ios
      - name: Build unsigned Release app
        run: >-
          xcodebuild
          -workspace ios/HeroFootballManager.xcworkspace
          -scheme HeroFootballManager
          -configuration Release
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/hfm-derived"
          CODE_SIGNING_ALLOWED=NO
          build
      - name: Inspect the built app and font license
        run: >-
          npm run release:inspect --
          "$RUNNER_TEMP/hfm-derived/Build/Products/Release-iphonesimulator/HeroFootballManager.app"
