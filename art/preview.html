<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hero Football Manager — M0 Sprite Pack Preview</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #101418;
    color: #eef1f5;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 32px 24px 64px;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: #8a93a0; font-size: 13px; margin-bottom: 8px; }
  .legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px; color: #8a93a0; margin-bottom: 32px; }
  .legend span.swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
  .team-section { margin-bottom: 40px; }
  .team-title {
    font-size: 15px; font-weight: 700; padding: 6px 14px; border-radius: 6px;
    display: inline-block; margin-bottom: 16px; letter-spacing: 0.02em;
  }
  .team-title.rovers { background: rgba(232, 67, 63, 0.14); color: #ff8f8b; border: 1px solid #e8433f; }
  .team-title.united { background: rgba(63, 111, 216, 0.14); color: #9db8ff; border: 1px solid #3f6fd8; }
  .team-title.neutral { background: rgba(255, 255, 255, 0.08); color: #eef1f5; border: 1px solid #444d5a; }
  .grid { display: flex; flex-wrap: wrap; gap: 16px; }
  .card {
    background: #171d24; border: 1px solid #262f3a; border-radius: 10px;
    padding: 12px; width: 232px;
  }
  .card.star { border-color: #e0b23a; box-shadow: 0 0 0 2px rgba(224, 178, 58, 0.35); }
  .card .label { font-size: 13px; font-weight: 700; margin-bottom: 2px; }
  .card .label .star-badge { color: #e0b23a; font-size: 10px; font-weight: 700; margin-left: 6px; }
  .card .meta { font-size: 11px; color: #8a93a0; margin-bottom: 10px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .sprites-row { display: flex; gap: 8px; align-items: flex-end; }
  .sprite-box { text-align: center; }
  .sprite-box canvas {
    image-rendering: pixelated;
    image-rendering: -moz-crisp-edges;
    image-rendering: crisp-edges;
    background: #2e7d4f;
    border-radius: 3px;
    display: block;
  }
  .sprite-box .tag { font-size: 10px; color: #8a93a0; margin-top: 4px; }
  .ball-section .card { width: auto; display: inline-block; }
  .zoom-note { color: #8a93a0; font-size: 12px; margin: -8px 0 12px; }
  .pitch-strip {
    display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end;
    background: #2e7d4f; padding: 12px; border-radius: 8px; margin-bottom: 12px;
  }
  .zoom-unit { text-align: center; }
  .zoom-unit .pair { display: flex; gap: 2px; justify-content: center; }
  .zoom-unit.star .pair { outline: 2px solid #e0b23a; outline-offset: 1px; border-radius: 2px; }
  .zoom-unit canvas { image-rendering: pixelated; image-rendering: -moz-crisp-edges; image-rendering: crisp-edges; display: block; }
  .zoom-unit .tag { font-size: 9px; color: rgba(10, 26, 16, 0.9); margin-top: 3px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
</style>

<script>
(function () {
  const SHEET = JSON.parse(document.getElementById('sheet-data').textContent);
  const ROSTER = JSON.parse(document.getElementById('roster-data').textContent);
  const SCALE = 8;
  const FPS = 6;

  function drawSprite(canvas, rows, scale) {
    const px = scale || SCALE;
    const w = rows[0].length, h = rows.length;
    canvas.width = w;
    canvas.height = h;
    canvas.style.width = (w * px) + 'px';
    canvas.style.height = (h * px) + 'px';
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, w, h);
    for (let y = 0; y < h; y++) {
      const row = rows[y];
      for (let x = 0; x < row.length; x++) {
        const color = SHEET.palette[row[x]];
        if (!color) continue; // transparent — let the backdrop show through
        ctx.fillStyle = color;
        ctx.fillRect(x, y, 1, 1);
      }
    }
  }

  function spriteBox(tag, rows) {
    const box = document.createElement('div');
    box.className = 'sprite-box';
    const canvas = document.createElement('canvas');
    drawSprite(canvas, rows);
    const label = document.createElement('div');
    label.className = 'tag';
    label.textContent = tag;
    box.appendChild(canvas);
    box.appendChild(label);
    return box;
  }

  function animatedBox(id) {
    const box = document.createElement('div');
    box.className = 'sprite-box';
    const canvas = document.createElement('canvas');
    const frames = [SHEET.sprites[id + ':run0'], SHEET.sprites[id + ':run1']];
    let frame = 0;
    drawSprite(canvas, frames[0]);
    setInterval(function () {
      frame = 1 - frame;
      drawSprite(canvas, frames[frame]);
    }, 1000 / FPS);
    const label = document.createElement('div');
    label.className = 'tag';
    label.textContent = 'animated';
    box.appendChild(canvas);
    box.appendChild(label);
    return box;
  }

  function buildCard(player) {
    const card = document.createElement('div');
    card.className = 'card' + (player.star ? ' star' : '');

    const label = document.createElement('div');
    label.className = 'label';
    label.innerHTML = player.id + ' \u00b7 ' + player.name + (player.star ? ' <span class="star-badge">\u2605 HERO STAR</span>' : '');

    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.textContent = player.role;

    const row = document.createElement('div');
    row.className = 'sprites-row';
    row.appendChild(spriteBox('run0', SHEET.sprites[player.id + ':run0']));
    row.appendChild(spriteBox('run1', SHEET.sprites[player.id + ':run1']));
    row.appendChild(animatedBox(player.id));

    card.appendChild(label);
    card.appendChild(meta);
    card.appendChild(row);
    return card;
  }

  function teamSection(app, teamKey, teamLabel, cls) {
    const section = document.createElement('div');
    section.className = 'team-section';
    const title = document.createElement('div');
    title.className = 'team-title ' + cls;
    title.textContent = teamLabel;
    section.appendChild(title);
    const grid = document.createElement('div');
    grid.className = 'grid';
    ROSTER.filter(function (p) { return p.team === teamKey; }).forEach(function (p) {
      grid.appendChild(buildCard(p));
    });
    section.appendChild(grid);
    app.appendChild(section);
  }

  function zoomUnit(labelText, isStar, spriteKeys) {
    const unit = document.createElement('div');
    unit.className = 'zoom-unit' + (isStar ? ' star' : '');
    const pair = document.createElement('div');
    pair.className = 'pair';
    spriteKeys.forEach(function (key) {
      const canvas = document.createElement('canvas');
      drawSprite(canvas, SHEET.sprites[key], 2);
      pair.appendChild(canvas);
    });
    const tag = document.createElement('div');
    tag.className = 'tag';
    tag.textContent = labelText;
    unit.appendChild(pair);
    unit.appendChild(tag);
    return unit;
  }

  function zoomSection(app) {
    const section = document.createElement('div');
    section.className = 'team-section';
    const title = document.createElement('div');
    title.className = 'team-title neutral';
    title.textContent = 'Match zoom (2\u00d7)';
    section.appendChild(title);
    const note = document.createElement('div');
    note.className = 'zoom-note';
    note.textContent = 'Roughly the in-match sprite size on the pitch \u2014 judge readability here, not just at 8\u00d7. Gold outline = star.';
    section.appendChild(note);

    ['rovers', 'united'].forEach(function (teamKey) {
      const strip = document.createElement('div');
      strip.className = 'pitch-strip';
      ROSTER.filter(function (p) { return p.team === teamKey; }).forEach(function (p) {
        strip.appendChild(zoomUnit(p.id, p.star, [p.id + ':run0', p.id + ':run1']));
      });
      if (teamKey === 'united') {
        strip.appendChild(zoomUnit('ball', false, ['ball']));
      }
      section.appendChild(strip);
    });
    app.appendChild(section);
  }

  const app = document.getElementById('app');
  teamSection(app, 'rovers', 'Bramble Rovers (home)', 'rovers');
  teamSection(app, 'united', 'Ferrous United (away)', 'united');

  const ballSection = document.createElement('div');
  ballSection.className = 'team-section ball-section';
  const ballTitle = document.createElement('div');
  ballTitle.className = 'team-title neutral';
  ballTitle.textContent = 'Ball';
  ballSection.appendChild(ballTitle);
  const ballCard = document.createElement('div');
  ballCard.className = 'card';
  ballCard.appendChild(spriteBox('ball (6\u00d76)', SHEET.sprites.ball));
  ballSection.appendChild(ballCard);
  app.appendChild(ballSection);

  zoomSection(app);
})();
</script>
