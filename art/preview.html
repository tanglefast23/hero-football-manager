<script>
(function () {
  const SHEET = JSON.parse(document.getElementById('sheet-data').textContent);
  const ROSTER = JSON.parse(document.getElementById('roster-data').textContent);
  const SCALE = 8;
  const FPS = 6;

  function drawSprite(canvas, rows) {
    const w = rows[0].length, h = rows.length;
    canvas.width = w;
    canvas.height = h;
    canvas.style.width = (w * SCALE) + 'px';
    canvas.style.height = (h * SCALE) + 'px';
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, w, h);
    for (let y = 0; y < h; y++) {
      const row = rows[y];
      for (let x = 0; x < row.length; x++) {
        const color = SHEET.palette[row[x]];
        if (!color) continue; // transparent — let the green pitch backdrop show through
        ctx.fillStyle = color;
        ctx.fillRect(x, y, 1, 1);
      }
    }
  }

  function spriteBox(tag, rows) {
    const box = document.createElement('div');
    box.className = 'sprite-box';
    const canvas = document.createElement('canvas');
    drawSprite(canvas, rows);
    const label = document.createElement('div');
    label.className = 'tag';
    label.textContent = tag;
    box.appendChild(canvas);
    box.appendChild(label);
    return box;
  }

  function animatedBox(id) {
    const box = document.createElement('div');
    box.className = 'sprite-box';
    const canvas = document.createElement('canvas');
    const frames = [SHEET.sprites[id + ':run0'], SHEET.sprites[id + ':run1']];
    let frame = 0;
    drawSprite(canvas, frames[0]);
    setInterval(function () {
      frame = 1 - frame;
      drawSprite(canvas, frames[frame]);
    }, 1000 / FPS);
    const label = document.createElement('div');
    label.className = 'tag';
    label.textContent = 'animated';
    box.appendChild(canvas);
    box.appendChild(label);
    return box;
  }

  function buildCard(player) {
    const card = document.createElement('div');
    card.className = 'card' + (player.star ? ' star' : '');

    const label = document.createElement('div');
    label.className = 'label';
    label.innerHTML = player.id + ' \u00b7 ' + player.name + (player.star ? ' <span class="star-badge">\u2605 HERO STAR</span>' : '');

    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.textContent = player.role;

    const row = document.createElement('div');
    row.className = 'sprites-row';
    row.appendChild(spriteBox('run0', SHEET.sprites[player.id + ':run0']));
    row.appendChild(spriteBox('run1', SHEET.sprites[player.id + ':run1']));
    row.appendChild(animatedBox(player.id));

    card.appendChild(label);
    card.appendChild(meta);
    card.appendChild(row);
    return card;
  }

  function teamSection(app, teamKey, teamLabel, cls) {
    const section = document.createElement('div');
    section.className = 'team-section';
    const title = document.createElement('div');
    title.className = 'team-title ' + cls;
    title.textContent = teamLabel;
    section.appendChild(title);
    const grid = document.createElement('div');
    grid.className = 'grid';
    ROSTER.filter(function (p) { return p.team === teamKey; }).forEach(function (p) {
      grid.appendChild(buildCard(p));
    });
    section.appendChild(grid);
    app.appendChild(section);
  }

  const app = document.getElementById('app');
  teamSection(app, 'rovers', 'Bramble Rovers (home)', 'rovers');
  teamSection(app, 'united', 'Ferrous United (away)', 'united');

  const ballSection = document.createElement('div');
  ballSection.className = 'team-section ball-section';
  const ballTitle = document.createElement('div');
  ballTitle.className = 'team-title neutral';
  ballTitle.textContent = 'Ball';
  ballSection.appendChild(ballTitle);
  const ballCard = document.createElement('div');
  ballCard.className = 'card';
  ballCard.appendChild(spriteBox('ball (6\u00d76)', SHEET.sprites.ball));
  ballSection.appendChild(ballCard);
  app.appendChild(ballSection);
})();
</script>
